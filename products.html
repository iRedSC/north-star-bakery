<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>North Star Bakery</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="favorites.js"></script>
    </head>
    <body>
        <header>
            <nav aria-label="Main navigation">
                <a href="index.html">
                    <img
                        src="assets/bakery-logo_c.png"
                        alt="North Star Bakery"
                        width="83.35"
                        height="71.15"
                    />
                </a>

                <ul class="nav-links">
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="hero">
                <img
                    width="500"
                    src="assets/bakery-bread_c.png"
                    alt="North Star Bakery Storefront"
                />
            </section>
            <section class="products">
                <div class="menu-title">
                    <h1>Our Menu</h1>
                    <p>Monthly specials are marked with a *</p>
                </div>
                <label for="favorites-toggle">
                    <input type="checkbox" id="favorites-toggle" />

                </label>

                <div class="menu"></div>
            </section>
        </main>
        <footer>
            <p>© 2026 North Star Bakery</p>

            <nav aria-label="Footer navigation">
                <ul class="nav-links">
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
